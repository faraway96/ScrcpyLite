name: Build ScrcpyLite

on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Generate ephemeral signing keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/lite23.jks -storetype PKCS12 \
            -alias lite23 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lite23pass -keypass lite23pass \
            -dname "CN=ScrcpyLite"
          {
            echo "RELEASE_STORE_FILE=/tmp/lite23.jks"
            echo "RELEASE_STORE_PASSWORD=lite23pass"
            echo "RELEASE_KEY_ALIAS=lite23"
            echo "RELEASE_KEY_PASSWORD=lite23pass"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrcpylite-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
